<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razorpay Payment Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .status { font-weight: bold; }
    .status.success { color: green; }
    .status.pending { color: orange; }
    .status.failed { color: red; }
    #alert.hidden { display: none; }
    #alert { margin-top: 1rem; }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-4">Razorpay Payment Demo</h1>
  <div id="alert" class="alert alert-danger hidden" role="alert"></div>
  <p>Status: <span id="statusBadge" class="status pending">Pending</span></p>
  <p id="paymentDetails"></p>

  <!-- The script will read URL params: candidate_id, assessment_id, payment_id -->
  <script src="js/payment-gateway.js"></script>
</body>
</html>
